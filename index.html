<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/*
===========================================================
FIREBASE CONFIGURATION

REPLACE THE VALUES BELOW WITH YOUR FIREBASE CONFIG.

DO NOT DELETE THE STRUCTURE.

Example:

const firebaseConfig = {
    apiKey: "AIza...",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    storageBucket: "your-project.firebasestorage.app",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
};

===========================================================
*/

const firebaseConfig = {

    apiKey:
        "PASTE_YOUR_API_KEY_HERE",

    authDomain:
        "PASTE_YOUR_PROJECT_ID.firebaseapp.com",

    projectId:
        "PASTE_YOUR_PROJECT_ID_HERE",

    storageBucket:
        "PASTE_YOUR_STORAGE_BUCKET_HERE",

    messagingSenderId:
        "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",

    appId:
        "PASTE_YOUR_APP_ID_HERE"

};


/* ========================================================
   FIREBASE INITIALIZATION
======================================================== */

let app = null;
let db = null;


try {

    app = initializeApp(
        firebaseConfig
    );

    db = getFirestore(app);

}

catch (error) {

    console.error(error);

}


/* ========================================================
   VARIABLES
======================================================== */

let records = [];

let editingDocumentId = null;


/* ========================================================
   ELEMENTS
======================================================== */

const form =
    document.getElementById(
        "recordForm"
    );


const recordTableBody =
    document.getElementById(
        "recordTableBody"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const recordCount =
    document.getElementById(
        "recordCount"
    );


const cancelButton =
    document.getElementById(
        "cancelButton"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


/* ========================================================
   STATUS
======================================================== */

function setStatus(
    message,
    type = "normal"
) {

    statusMessage.textContent =
        message;


    statusMessage.className =
        "status";


    if (type === "success") {

        statusMessage.classList.add(
            "success"
        );

    }


    if (type === "error") {

        statusMessage.classList.add(
            "error"
        );

    }

}


/* ========================================================
   LOAD RECORDS
======================================================== */

async function loadRecords() {

    if (!db) {

        setStatus(
            "Firebase configuration is missing.",
            "error"
        );

        recordTableBody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    Firebase is not configured.
                </td>
            </tr>
        `;

        return;

    }


    try {

        setStatus(
            "Loading shared records..."
        );


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "missingRecords"
                )
            );


        records = [];


        snapshot.forEach(
            (documentSnapshot) => {

                records.push({

                    firestoreId:
                        documentSnapshot.id,

                    ...documentSnapshot.data()

                });

            }
        );


        renderRecords();


        setStatus(
            "Shared database ready.",
            "success"
        );

    }

    catch (error) {

        console.error(error);


        setStatus(
            "Could not load records: " +
            error.message,
            "error"
        );


        recordTableBody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    Unable to load records.
                </td>
            </tr>
        `;

    }

}


/* ========================================================
   ADD / UPDATE RECORD
======================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!db) {

            alert(
                "Firebase is not configured."
            );

            return;

        }


        const recordId =
            document.getElementById(
                "recordId"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value;


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        const timestamp =
            document.getElementById(
                "timestamp"
            ).value;


        const details =
            document.getElementById(
                "details"
            ).value.trim();


        const status =
            document.getElementById(
                "status"
            ).value;


        if (
            !recordId ||
            !category ||
            !name ||
            !location ||
            !timestamp
        ) {

            alert(
                "Please complete all required fields."
            );

            return;

        }


        const recordData = {

            recordId:
                recordId,

            category:
                category,

            name:
                name,

            location:
                location,

            timestamp:
                timestamp,

            details:
                details,

            status:
                status

        };


        try {

            if (editingDocumentId) {

                setStatus(
                    "Updating record..."
                );


                const recordReference =
                    doc(
                        db,
                        "missingRecords",
                        editingDocumentId
                    );


                await updateDoc(
                    recordReference,
                    {
                        ...recordData,

                        lastUpdated:
                            serverTimestamp()
                    }
                );


                setStatus(
                    "Record updated successfully.",
                    "success"
                );

            }

            else {

                setStatus(
                    "Saving record..."
                );


                await addDoc(
                    collection(
                        db,
                        "missingRecords"
                    ),
                    {

                        ...recordData,

                        createdAt:
                            serverTimestamp(),

                        lastUpdated:
                            serverTimestamp()

                    }
                );


                setStatus(
                    "Record saved to the shared database.",
                    "success"
                );

            }


            editingDocumentId =
                null;


            form.reset();


            await loadRecords();

        }

        catch (error) {

            console.error(error);


            setStatus(
                "Error saving record: " +
                error.message,
                "error"
            );

        }

    }
);


/* ========================================================
   DISPLAY RECORDS
======================================================== */

function renderRecords() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filteredRecords =
        records.filter(
            record => {

                const searchableText = [

                    record.recordId,
                    record.category,
                    record.name,
                    record.location,
                    record.timestamp,
                    record.details,
                    record.status

                ]
                .join(" ")
                .toLowerCase();


                return searchableText
                    .includes(search);

            }
        );


    recordCount.textContent =
        "Database contains " +
        records.length +
        " records. Showing " +
        filteredRecords.length +
        ".";


    if (
        filteredRecords.length === 0
    ) {

        recordTableBody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
