<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> 
<meta name="google-site-verification"
 content="p6cdjFvstnfGgcKZ_m7X-05Y3CStDKBe4FmC0zXdmbA" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missing Tracker Database</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#f3f5f8;color:#222
}
header{
 background:#087ff5;color:white;
 text-align:center;padding:20px
}
main{width:95%;max-width:1400px;margin:20px auto}
.panel{
 background:white;padding:20px;margin-bottom:20px;
 border-radius:12px;
 box-shadow:0 2px 10px #ddd
}
h2{margin-top:0}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px
}
.field{display:flex;flex-direction:column}
.full{grid-column:1/-1}
label{font-weight:bold;margin-bottom:6px}
input,select,textarea{
 width:100%;padding:12px;
 border:1px solid #bbb;
 border-radius:8px;
 font-size:16px
}
textarea{min-height:100px}
.actions{
 display:flex;gap:10px;
 flex-wrap:wrap;margin-top:15px
}
button{
 border:0;border-radius:8px;
 padding:12px 18px;
 font-weight:bold;
 cursor:pointer
}
.primary{background:#087ff5;color:white}
.success{background:#198754;color:white}
.danger{background:#dc3545;color:white}
.secondary{background:#6c757d;color:white}
.search{
 width:100%;
 border:2px solid #087ff5
}
.info{
 display:flex;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:10px;margin:15px 0
}
.status{
 background:#e8f4ff;
 color:#075cae;
 padding:8px 12px;
 border-radius:20px;
 font-weight:bold
}
.table-wrap{overflow-x:auto}
table{
 width:100%;
 min-width:1000px;
 border-collapse:collapse
}
th,td{
 padding:10px;
 border-bottom:1px solid #ddd;
 text-align:left;
 vertical-align:top
}
th{
 background:#17202a;
 color:white;
 white-space:nowrap
}
tr:nth-child(even){background:#f8f9fa}
.badge{
 padding:5px 8px;
 border-radius:5px;
 font-size:11px;
 font-weight:bold;
 white-space:nowrap
}
.new{background:#d9edf7;color:#075b83}
.updated{background:#fff3cd;color:#765b00}
.empty{text-align:center;padding:30px;color:#777}
.small{padding:7px 10px;font-size:12px}

@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 main{width:96%}
 .panel{padding:15px}
}
</style>
</head>

<body>

<header>
<h1>Missing Tracker Database</h1>
</header>

<main>

<section class="panel">

<h2 id="title">Log Record Entry</h2>

<div class="grid">

<div class="field">
<label>Record ID</label>
<input id="recordId" placeholder="Example: MT-001">
</div>

<div class="field">
<label>Category</label>
<select id="category">
<option value="">-- Select Category --</option>
<option>Person</option>
<option>Item / Asset</option>
<option>Location</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Name / Description</label>
<input id="name" placeholder="Enter name or description">
</div>

<div class="field">
<label>Location</label>
<input id="location" placeholder="Enter location">
</div>

<div class="field">
<label>Official Timestamp</label>
<input id="datetime" type="datetime-local">
</div>

<div class="field full">
<label>Supplemental Structural Descriptions</label>
<textarea id="details" placeholder="Enter additional details..."></textarea>
</div>

</div>

<div class="actions">

<button
type="button"
class="primary"
onclick="saveRecord()">
Log Record Entry
</button>

<button
type="button"
class="secondary"
id="cancel"
onclick="cancelEdit()"
style="display:none">
Cancel Edit
</button>

<button
type="button"
class="success"
onclick="backup()">
Copy Database Backup
</button>

</div>

</section>


<section class="panel">

<h2>Tracked Database Timeline</h2>

<input
id="search"
class="search"
placeholder="🔎 Search database..."
oninput="render()">

<div class="info">

<strong id="count">
Database contains 0 records.
</strong>

<span
id="status"
class="status">
DATABASE READY
</span>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>
<th>Record ID</th>
<th>Category</th>
<th>Name / Description</th>
<th>Location</th>
<th>Timestamp</th>
<th>Details</th>
<th>Status</th>
<th>Version</th>
<th>Last Updated</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="table"></tbody>

</table>

</div>

</section>

</main>


<script>

/* =========================================
   OOP RECORD CLASS
   ========================================= */

class MissingRecord{

 constructor(id,category,name,location,time,details){

  this.id=id;
  this.category=category;
  this.name=name;
  this.location=location;
  this.time=time;
  this.details=details;

  this.version=1;

  this.createdAt=new Date().toISOString();
  this.updatedAt=this.createdAt;
 }

 update(category,name,location,time,details){

  this.category=category;
  this.name=name;
  this.location=location;
  this.time=time;
  this.details=details;

  this.version++;

  this.updatedAt=new Date().toISOString();
 }
}


/* =========================================
   OOP DATABASE CLASS
   ========================================= */

class Database{

 constructor(){

  this.key="missing_tracker_js_database";
  this.records=[];

  this.load();
 }

 load(){

  try{

   let data=localStorage.getItem(this.key);

   if(data){

    let saved=JSON.parse(data);

    this.records=saved.map(x=>{

     let r=new MissingRecord(
      x.id,
      x.category,
      x.name,
      x.location,
      x.time,
      x.details
     );

     r.version=x.version||1;
     r.createdAt=x.createdAt;
     r.updatedAt=x.updatedAt;

     return r;
    });
   }

  }catch(e){

   console.log("Storage unavailable.");

  }
 }

 save(){

  try{

   localStorage.setItem(
    this.key,
    JSON.stringify(this.records)
   );

  }catch(e){

   console.log("Could not use localStorage.");

  }
 }

 find(id){

  return this.records.find(
   r=>r.id===id
  );
 }

 add(record){

  if(this.find(record.id))
   return false;

  this.records.push(record);
  this.save();

  return true;
 }

 update(id,data){

  let r=this.find(id);

  if(!r)return false;

  r.update(
   data.category,
   data.name,
   data.location,
   data.time,
   data.details
  );

  this.save();

  return true;
 }

 remove(id){

  let old=this.records.length;

  this.records=this.records.filter(
   r=>r.id!==id
  );

  this.save();

  return old!==this.records.length;
 }

 search(text){

  text=text.toLowerCase().trim();

  if(!text)return this.records;

  return this.records.filter(r=>

   r.id.toLowerCase().includes(text)||
   r.category.toLowerCase().includes(text)||
   r.name.toLowerCase().includes(text)||
   r.location.toLowerCase().includes(text)||
   r.details.toLowerCase().includes(text)

  );
 }
}


/* =========================================
   CREATE JAVASCRIPT DATABASE
   ========================================= */

const db=new Database();

let editing=null;


/* =========================================
   GET ELEMENT
   ========================================= */

const $=id=>document.getElementById(id);


/* =========================================
   SAVE / LOG RECORD
   ========================================= */

function saveRecord(){

 let id=$("recordId").value.trim().toUpperCase();
 let category=$("category").value;
 let name=$("name").value.trim();
 let location=$("location").value.trim();
 let time=$("datetime").value;
 let details=$("details").value.trim();


 /* VALIDATION */

 if(!id){
  alert("Please enter a Record ID.");
  return;
 }

 if(!category){
  alert("Please select a Category.");
  return;
 }

 if(!name){
  alert("Please enter a Name / Description.");
  return;
 }

 if(!time){
  alert("Please select a Timestamp.");
  return;
 }


 let data={
  category,
  name,
  location,
  time,
  details
 };


 /* =====================================
    UPDATE EXISTING RECORD
    ===================================== */

 if(editing){

  if(db.update(editing,data)){

   $("status").textContent=
    "DATABASE UPDATED — "+editing;

   editing=null;

   clearForm();

   $("title").textContent=
    "Log Record Entry";

   $("cancel").style.display=
    "none";

   $("recordId").disabled=false;

   $("status").textContent=
    "DATABASE UPDATED";

   render();
  }

  return;
 }


 /* =====================================
    CHECK DUPLICATE ID
    ===================================== */

 if(db.find(id)){

  if(confirm(
   "Record "+id+
   " already exists.\n\n"+
   "Update this record?"
  )){

   editRecord(id);
  }

  return;
 }


 /* =====================================
    ADD NEW RECORD
    ===================================== */

 let record=new MissingRecord(
  id,
  category,
  name,
  location,
  time,
  details
 );


 if(db.add(record)){

  clearForm();

  $("status").textContent=
   "NEW RECORD SAVED — "+id;

  render();

 }

}


/* =========================================
   EDIT RECORD
   ========================================= */

function editRecord(id){

 let r=db.find(id);

 if(!r)return;

 editing=id;

 $("recordId").value=r.id;
 $("category").value=r.category;
 $("name").value=r.name;
 $("location").value=r.location;
 $("datetime").value=r.time;
 $("details").value=r.details;

 $("recordId").disabled=true;

 $("title").textContent=
  "Update Record: "+id;

 $("cancel").style.display=
  "inline-block";

 $("status").textContent=
  "EDITING "+id;

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


/* =========================================
   CANCEL EDIT
   ========================================= */

function cancelEdit(){

 editing=null;

 clearForm();

 $("recordId").disabled=false;

 $("title").textContent=
  "Log Record Entry";

 $("cancel").style.display=
  "none";

 $("status").textContent=
  "DATABASE READY";

}


/* =========================================
   CLEAR FORM
   ========================================= */

function clearForm(){

 $("recordId").value="";
 $("category").value="";
 $("name").value="";
 $("location").value="";
 $("datetime").value="";
 $("details").value="";

}


/* =========================================
   DELETE
   ========================================= */

function deleteRecord(id){

 if(!confirm(
  "Delete record "+id+"?"
 ))return;

 if(db.remove(id)){

  $("status").textContent=
   "RECORD DELETED — "+id;

  render();
 }

}


/* =========================================
   FORMAT DATE
   ========================================= */

function dateText(value){

 if(!value)return "—";

 let d=new Date(value);

 if(isNaN(d))return value;

 return d.toLocaleString();

}


/* =========================================
   RENDER REAL TABLE
   ========================================= */

function render(){

 let rows=db.search(
  $("search").value
 );

 let table=$("table");

 table.innerHTML="";


 $("count").textContent=
  "Database contains "+
  rows.length+
  " record(s).";


 /* NO RECORDS */

 if(rows.length===0){

  let tr=document.createElement("tr");

  let td=document.createElement("td");

  td.colSpan=10;

  td.className="empty";

  td.textContent=
   $("search").value
   ?"No records match your search."
   :"No logs found. Add your first record above!";

  tr.appendChild(td);
  table.appendChild(tr);

  return;
 }


 /* CREATE TABLE ROWS */

 rows.forEach(r=>{

  let tr=document.createElement("tr");


  addCell(tr,r.id);
  addCell(tr,r.category);
  addCell(tr,r.name);
  addCell(tr,r.location);
  addCell(tr,dateText(r.time));
  addCell(tr,r.details);


  /* STATUS */

  let status=document.createElement("td");

  let badge=document.createElement("span");

  badge.className=
   "badge "+
   (r.version>1?"updated":"new");

  badge.textContent=
   r.version>1
   ?"DATABASE UPDATED"
   :"NEW RECORD";

  status.appendChild(badge);
  tr.appendChild(status);


  /* VERSION */

  addCell(
   tr,
   r.version===1
   ?"Initial"
   :"Update v"+r.version
  );


  /* UPDATED */

  addCell(
   tr,
   dateText(r.updatedAt)
  );


  /* ACTIONS */

  let actions=document.createElement("td");


  let edit=document.createElement("button");

  edit.className=
   "primary small";

  edit.textContent="Edit";

  edit.onclick=()=>{
   editRecord(r.id);
  };


  let del=document.createElement("button");

  del.className=
   "danger small";

  del.textContent="Delete";

  del.onclick=()=>{
   deleteRecord(r.id);
  };


  actions.appendChild(edit);
  actions.appendChild(del);

  tr.appendChild(actions);


  table.appendChild(tr);

 });

}


/* =========================================
   TABLE CELL
   ========================================= */

function addCell(row,value){

 let td=document.createElement("td");

 td.textContent=value||"—";

 row.appendChild(td);

}


/* =========================================
   SEARCH
   ========================================= */

function searchDatabase(){

 render();

 $("status").textContent=
  $("search").value.trim()
  ?"SEARCHING DATABASE"
  :"DATABASE READY";

}


/* =========================================
   BACKUP
   ========================================= */

function backup(){

 if(db.records.length===0){

  alert("Database is empty.");

  return;
 }


 let text=JSON.stringify(
  db.records,
  null,
  2
 );


 if(navigator.clipboard){

  navigator.clipboard.writeText(text)
   .then(()=>{

    alert(
     "Database backup copied."
    );

    $("status").textContent=
     "BACKUP COPIED";

   })
   .catch(()=>{

    prompt(
     "Copy your database backup:",
     text
    );

   });

 }else{

  prompt(
   "Copy your database backup:",
   text
  );

 }

}


/* =========================================
   START APPLICATION
   ========================================= */

render();

</script>

</body>
  </html>
